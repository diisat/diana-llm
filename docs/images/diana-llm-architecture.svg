<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1030" viewBox="0 0 1400 1030"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#71334b" stroke-width="1.5"/></marker></defs><rect width="1400" height="1030" fill="#f8f7f5"/><text x="70" y="62" font-family="Arial, sans-serif" font-size="15" fill="#71334b">L’ATELIER DE DIANA / SYSTEM DESIGN</text><text x="70" y="112" font-family="Arial, sans-serif" font-size="37" fill="#28252b">DianaLLM · independent service</text><text x="70" y="150" font-family="Arial, sans-serif" font-size="18" fill="#746d78">React sidebar + Python / FastAPI + LangChain + Groq. No model training or vector database.</text><text x="70" y="208" font-family="Arial, sans-serif" font-size="16" fill="#71334b">PORTFOLIO REPOSITORY · atelier-diana</text><rect x="70" y="230" width="510" height="160" rx="18" fill="white" stroke="#d4cbd9"/><text x="94" y="268" font-family="Arial, sans-serif" font-size="23" fill="#71334b">React sidebar</text><text x="94" y="303" font-family="Arial, sans-serif" font-size="17" fill="#28252b">English / French / Spanish · light / dark</text><text x="94" y="330" font-family="Arial, sans-serif" font-size="17" fill="#28252b">Accessible dialog, suggestions and source links</text><text x="94" y="357" font-family="Arial, sans-serif" font-size="17" fill="#28252b">Conversation held in browser memory</text><rect x="70" y="470" width="510" height="150" rx="18" fill="#ece5f3" stroke="#d4cbd9"/><text x="94" y="508" font-family="Arial, sans-serif" font-size="23" fill="#71334b">Next.js · POST /api/chat</text><text x="94" y="543" font-family="Arial, sans-serif" font-size="17" fill="#28252b">Same-origin proxy · bounded JSON requests</text><text x="94" y="570" font-family="Arial, sans-serif" font-size="17" fill="#28252b">CHAT_SERVICE_URL + CHAT_SERVICE_TOKEN</text><path d="M325 390 L325 470" stroke="#71334b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polygon points="325,470 330.0,458.0 320.0,458.0" fill="#71334b"/><text x="340" y="435" font-family="Arial, sans-serif" font-size="15" fill="#71334b">Question + recent turns</text><text x="750" y="208" font-family="Arial, sans-serif" font-size="16" fill="#71334b">INDEPENDENT REPOSITORY · diana-llm</text><rect x="750" y="230" width="580" height="180" rx="18" fill="#ece5f3" stroke="#d4cbd9"/><text x="774" y="268" font-family="Arial, sans-serif" font-size="23" fill="#71334b">FastAPI · POST /api/chat</text><text x="774" y="303" font-family="Arial, sans-serif" font-size="17" fill="#28252b">Shared-token authentication · input validation</text><text x="774" y="330" font-family="Arial, sans-serif" font-size="17" fill="#28252b">Request budgets · concurrency limit · timeout</text><text x="774" y="357" font-family="Arial, sans-serif" font-size="17" fill="#28252b">LangChain prompt + ChatGroq + structured answer</text><path d="M580 535 L750 340" stroke="#71334b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polygon points="750,340 738.3455139452719,345.7595967567313 745.8832412443498,352.33094876105554" fill="#71334b"/><text x="592" y="365" font-family="Arial, sans-serif" font-size="15" fill="#71334b">Private HTTP</text><rect x="750" y="480" width="580" height="140" rx="18" fill="#e3ede6" stroke="#d4cbd9"/><text x="774" y="518" font-family="Arial, sans-serif" font-size="23" fill="#71334b">diana-profile.json</text><text x="774" y="553" font-family="Arial, sans-serif" font-size="17" fill="#28252b">CV: authoritative dates, roles and technologies</text><text x="774" y="580" font-family="Arial, sans-serif" font-size="17" fill="#28252b">Technical dossier: mission context and details</text><path d="M1040 480 L1040 410" stroke="#71334b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polygon points="1040,410 1035.0,422.0 1045.0,422.0" fill="#71334b"/><text x="1055" y="450" font-family="Arial, sans-serif" font-size="15" fill="#71334b">Read-only</text><rect x="750" y="720" width="580" height="135" rx="18" fill="white" stroke="#d4cbd9"/><text x="774" y="758" font-family="Arial, sans-serif" font-size="23" fill="#71334b">Groq API · hosted language model</text><text x="774" y="793" font-family="Arial, sans-serif" font-size="17" fill="#28252b">GROQ_API_KEY stays in the Python service</text><text x="774" y="820" font-family="Arial, sans-serif" font-size="17" fill="#28252b">Receives public profile, question and recent turns</text><path d="M1330 320 L1370 320" stroke="#71334b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polygon points="1370,320 1358.0,315.0 1358.0,325.0" fill="#71334b"/><path d="M1370 320L1370 785L1330 785" fill="none" stroke="#71334b" stroke-width="2" marker-end="url(#arrow)"/><text x="1170" y="680" font-family="Arial, sans-serif" font-size="16" fill="#71334b">HTTPS to Groq</text><rect x="70" y="720" width="510" height="135" rx="18" fill="white" stroke="#d4cbd9"/><text x="94" y="758" font-family="Arial, sans-serif" font-size="23" fill="#71334b">JSON answer + related page links</text><text x="94" y="793" font-family="Arial, sans-serif" font-size="17" fill="#28252b">Response returns through the same API path</text><text x="94" y="820" font-family="Arial, sans-serif" font-size="17" fill="#28252b">The application does not persist conversations</text><text x="70" y="940" font-family="Arial, sans-serif" font-size="18" fill="#28252b">Pattern: layered service with adapters · React is an API client; Groq is a replaceable model adapter.</text><text x="70" y="976" font-family="Arial, sans-serif" font-size="16" fill="#746d78">No database dependency for chat. Rate budgets reset on service restart; use one worker in this version.</text><polygon points="1330,785 1342.0000132679068,789.9999681569049 1341.9999867320087,779.9999681569401" fill="#71334b"/></svg>