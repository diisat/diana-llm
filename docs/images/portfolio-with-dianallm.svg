<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#71334b" stroke-width="1.5"/></marker></defs><rect width="1400" height="1120" fill="#f8f7f5"/><text x="70" y="62" font-family="Arial, sans-serif" font-size="15" fill="#71334b">L’ATELIER DE DIANA / SYSTEM DESIGN</text><text x="70" y="112" font-family="Arial, sans-serif" font-size="37" fill="#28252b">Portfolio + DianaLLM</text><text x="70" y="150" font-family="Arial, sans-serif" font-size="18" fill="#746d78">Two independent repositories. One public website, with private application services.</text><rect x="440" y="200" width="520" height="125" rx="18" fill="white" stroke="#d4cbd9"/><text x="464" y="238" font-family="Arial, sans-serif" font-size="23" fill="#71334b">Visitor · React / Next.js interface</text><text x="464" y="273" font-family="Arial, sans-serif" font-size="17" fill="#28252b">Portfolio pages + Three.js map + chat sidebar</text><text x="464" y="300" font-family="Arial, sans-serif" font-size="17" fill="#28252b">Browser holds the conversation in memory</text><path d="M700 325 L700 390" stroke="#71334b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polygon points="700,390 705.0,378.0 695.0,378.0" fill="#71334b"/><text x="720" y="363" font-family="Arial, sans-serif" font-size="15" fill="#71334b">HTTPS in production</text><rect x="440" y="390" width="520" height="145" rx="18" fill="#ece5f3" stroke="#d4cbd9"/><text x="464" y="428" font-family="Arial, sans-serif" font-size="23" fill="#71334b">Next.js server · public web service</text><text x="464" y="463" font-family="Arial, sans-serif" font-size="17" fill="#28252b">Pages, static files, CV and certificates</text><text x="464" y="490" font-family="Arial, sans-serif" font-size="17" fill="#28252b">/api/notes → Java    /api/chat → FastAPI</text><rect x="70" y="650" width="510" height="150" rx="18" fill="white" stroke="#d4cbd9"/><text x="94" y="688" font-family="Arial, sans-serif" font-size="23" fill="#71334b">Spring Boot · Java 21</text><text x="94" y="723" font-family="Arial, sans-serif" font-size="17" fill="#28252b">Projects and moderated guestbook notes</text><text x="94" y="750" font-family="Arial, sans-serif" font-size="17" fill="#28252b">Existing portfolio backend · private network</text><rect x="820" y="650" width="510" height="150" rx="18" fill="#ece5f3" stroke="#d4cbd9"/><text x="844" y="688" font-family="Arial, sans-serif" font-size="23" fill="#71334b">DianaLLM · Python / FastAPI</text><text x="844" y="723" font-family="Arial, sans-serif" font-size="17" fill="#28252b">Validation + budgets + LangChain + ChatGroq</text><text x="844" y="750" font-family="Arial, sans-serif" font-size="17" fill="#28252b">Independent repository · private network</text><path d="M560 535L560 582L325 582L325 650" fill="none" stroke="#71334b" stroke-width="2" marker-end="url(#arrow)"/><text x="135" y="608" font-family="Arial, sans-serif" font-size="16" fill="#71334b">API_URL · private HTTP</text><path d="M840 535L840 582L1075 582L1075 650" fill="none" stroke="#71334b" stroke-width="2" marker-end="url(#arrow)"/><text x="875" y="570" font-family="Arial, sans-serif" font-size="16" fill="#71334b">CHAT_SERVICE_URL + shared token</text><rect x="70" y="890" width="510" height="125" rx="18" fill="#e3ede6" stroke="#d4cbd9"/><text x="94" y="928" font-family="Arial, sans-serif" font-size="23" fill="#71334b">PostgreSQL 16</text><text x="94" y="963" font-family="Arial, sans-serif" font-size="17" fill="#28252b">Projects + guestbook · durable storage</text><text x="94" y="990" font-family="Arial, sans-serif" font-size="17" fill="#28252b">Flyway migrations · no chat-history table</text><path d="M325 800 L325 890" stroke="#71334b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polygon points="325,890 330.0,878.0 320.0,878.0" fill="#71334b"/><text x="345" y="848" font-family="Arial, sans-serif" font-size="15" fill="#71334b">JDBC · private connection</text><rect x="820" y="890" width="245" height="125" rx="18" fill="#e3ede6" stroke="#d4cbd9"/><text x="844" y="928" font-family="Arial, sans-serif" font-size="23" fill="#71334b">Profile JSON</text><text x="844" y="963" font-family="Arial, sans-serif" font-size="17" fill="#28252b">Verified public facts</text><text x="844" y="990" font-family="Arial, sans-serif" font-size="17" fill="#28252b">Read-only file</text><rect x="1090" y="890" width="240" height="125" rx="18" fill="white" stroke="#d4cbd9"/><text x="1114" y="928" font-family="Arial, sans-serif" font-size="23" fill="#71334b">Groq API</text><text x="1114" y="963" font-family="Arial, sans-serif" font-size="17" fill="#28252b">Hosted LLM</text><text x="1114" y="990" font-family="Arial, sans-serif" font-size="17" fill="#28252b">External HTTPS</text><path d="M942 800 L942 890" stroke="#71334b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polygon points="942,890 947.0,878.0 937.0,878.0" fill="#71334b"/><text x="956" y="848" font-family="Arial, sans-serif" font-size="15" fill="#71334b">read</text><path d="M1208 800 L1208 890" stroke="#71334b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polygon points="1208,890 1213.0,878.0 1203.0,878.0" fill="#71334b"/><text x="1223" y="848" font-family="Arial, sans-serif" font-size="15" fill="#71334b">API key</text><text x="70" y="1080" font-family="Arial, sans-serif" font-size="18" fill="#28252b">Secrets stay on servers. Deploy services privately; only the Next.js website needs a public URL.</text><polygon points="325,650 330.00004407842755,638.0000183661065 320.00004407849497,637.9999816340554" fill="#71334b"/><polygon points="1075,650 1080.0000440784277,638.0000183661065 1070.000044078495,637.9999816340554" fill="#71334b"/></svg>